# 3 GiB: la AppVM Apps, che compila tutto, e' passata a 8 GB di RAM il 7
# settembre 2026. Con 4 GB il demone moriva a meta' bundle e il valore era
# sceso a 2; adesso ci sta di nuovo, e R8 va piu' spedito.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
